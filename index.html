<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Informasi Akademik</title>
  
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i data-lucide="graduation-cap" width="36" height="36"></i>
        <h1>SIAKAD Login</h1>
        <p>Silakan masuk menggunakan akun Anda</p>
      </div>

      <form id="loginForm">
        <div id="generalError" class="alert-error" style="display: none; color: red; margin-bottom: 1rem; text-align: center;"></div>
        
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>

        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="password-wrapper" style="position: relative;">
            <input type="password" id="password" placeholder="Masukkan kata sandi" required style="width: 100%;">
            <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer;">
              <i data-lucide="eye" width="18" height="18"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 1rem; background: #2563eb; color: #fff; padding: 0.75rem; border: none; border-radius: 6px; cursor: pointer;">Masuk</button>
      </form>
    </div>
  </div>

  <script src="assets/js/utils/storage.js"></script>
  <script src="assets/js/services/auth.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
