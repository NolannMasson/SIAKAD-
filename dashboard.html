<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Informasi Akademik</title>
  
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="dashboard-layout">
    
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <i data-lucide="graduation-cap" width="28" height="28"></i>
        <span class="brand-text">SIAKAD System</span>
      </div>

      <ul id="sidebarMenu" class="sidebar-menu">
      </ul>
    </aside>

    <div class="main-wrapper">
      
      <header class="topbar">
        <div class="topbar-left">
          <button id="toggleSidebar" class="btn-toggle-sidebar" aria-label="Toggle Navigation">
            <i data-lucide="menu" width="20" height="20"></i>
          </button>
          
          <nav class="breadcrumb">
            <span>SIAKAD</span>
            <i data-lucide="chevron-right" width="14" height="14"></i>
            <span class="active" id="breadcrumbCurrent">Dashboard</span>
          </nav>
        </div>

        <div class="topbar-right">
          <div class="notification-wrapper">
            <button id="btnNotification" class="btn-icon" aria-label="Notifikasi">
              <i data-lucide="bell" width="20" height="20"></i>
              <span class="badge">2</span>
            </button>
            <div id="notificationDropdown" class="notification-dropdown">
              <div class="notification-header">Notifikasi Sistem</div>
              <ul class="notification-list">
                <li class="notification-item">
                  <div>Jadwal Pengisian KRS semester ganjil dibuka.</div>
                  <div class="time">10 Menit yang lalu</div>
                </li>
                <li class="notification-item">
                  <div>Selamat Datang di Portal SIAKAD Baru.</div>
                  <div class="time">1 Hari yang lalu</div>
                </li>
              </ul>
            </div>
          </div>

          <div class="user-profile">
            <div class="avatar" id="userAvatar">U</div>
            <div class="user-info">
              <span class="user-name" id="userName">User Name</span>
              <span class="user-role-badge" id="userRole">Role</span>
            </div>
            <button id="btnLogout" class="btn-icon btn-logout-icon" title="Keluar dari Akun">
              <i data-lucide="log-out" width="18" height="18"></i>
            </button>
          </div>
        </div>
      </header>

      <main class="content-area">
        <div class="page-header">
          <h1 class="page-title" id="pageTitle">Dashboard</h1>
        </div>

        <div id="mainContentContainer">
        </div>
      </main>

    </div>
  </div>

  <script src="assets/js/utils/storage.js"></script>
  <script src="assets/js/services/auth.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
